<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Profile Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-shape shape-a"></div>
  <div class="bg-shape shape-b"></div>
  <header class="hero">
    <p class="eyebrow"></p>
    <h1>Search Profiles</h1>
    <p class="subtitle"></p>
  </header>

  <main class="layout">
    <section class="panel form-panel">
      <h2 id="form-title">Add Profile</h2>
      <form id="profile-form">
        <div class="grid">
          <label>First Name
            <input id="fname" name="fname" required maxlength="100">
          </label>
          <label>Last Name
            <input id="lname" name="lname" required maxlength="100">
          </label>
          <label>Email
            <input id="email" name="email" type="email" required maxlength="200">
          </label>
          <label>Phone
            <input id="ps" name="ps" required maxlength="120">
          </label>
          <label>Group
            <input id="group" name="group" required maxlength="100">
          </label>
        </div>

        <label>DETAILS
          <textarea id="DETAILS" name="DETAILS" rows="3" maxlength="2000"></textarea>
        </label>

        <label>SKILLS
          <textarea id="SKILLS" name="SKILLS" rows="3" maxlength="1000" placeholder="Example: Java, Spring Boot, SQL"></textarea>
        </label>

        <div class="actions">
          <button type="submit" id="save-btn">Save Profile</button>
          <button type="button" class="ghost" id="cancel-edit" hidden>Cancel Edit</button>
        </div>
      </form>
      <p id="message" aria-live="polite"></p>
    </section>

    <section class="panel search-panel">
      <div class="search-head">
        <h2>Search</h2>
        <span id="results-count"></span>
      </div>
      <div class="search-controls">
        <input id="search-name" placeholder="Search by name">
        <input id="search-skills" placeholder="Search by skills">
        <button id="search-btn">Find</button>
        <button id="clear-btn" class="ghost">Clear</button>
      </div>
      <div id="cards" class="cards"></div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
